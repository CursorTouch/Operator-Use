[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operator_use"]

[project]
name = "operator_use"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agent-client-protocol>=0.10.0",
    "anthropic>=0.100.0",
    "croniter>=3.0.0",
    "ddgs>=9.14.2",
    "filelock>=3.29.0",
    "google-genai>=1.75.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "mistralai>=1.9,<2",
    "ollama>=0.6.2",
    "openai>=2.35.1",
    "pillow>=12.2.0",
    "platformdirs>=4.9.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "websockets>=16.0",
    "fastmcp>=2.0.0",
    "aiohttp>=3.13.5",
    "jinja2-strcase>=0.0.2",
    "inflection>=0.5.1",
    "prompt-toolkit>=3.0.52",
    "python-telegram-bot>=20.0",
    "aiortc>=1.14.0",
    "requests>=2.32.0",
    "tabulate>=0.9.0",
    "fuzzywuzzy>=0.18.0; sys_platform == 'win32'",
    "psutil>=7.0.0; sys_platform == 'win32'",
    "comtypes>=1.4.15; sys_platform == 'win32'",
    "pywin32>=311; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
operator = "operator_use.console.main:cli"

[project.optional-dependencies]
telegram = ["python-telegram-bot>=20.0"]
discord  = ["discord.py>=2.0"]
slack    = ["slack-bolt>=1.0"]
twitch   = ["twitchio>=2.0"]
memory   = ["mem0ai>=0.1.0", "supermemory>=0.3.0"]
channels = [
    "python-telegram-bot>=20.0",
    "discord.py>=2.0",
    "slack-bolt>=1.0",
    "twitchio>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
