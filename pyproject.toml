[project]
name = "program"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agent-client-protocol>=0.10.0",
    "anthropic>=0.100.0",
    "croniter>=3.0.0",
    "ddgs>=9.14.2",
    "filelock>=3.29.0",
    "google-genai>=1.75.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "mistralai>=1.9,<2",
    "ollama>=0.6.2",
    "openai>=2.35.1",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "websockets>=16.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=20.0"]
discord  = ["discord.py>=2.0"]
slack    = ["slack-bolt>=1.0"]
twitch   = ["twitchio>=2.0"]
channels = [
    "python-telegram-bot>=20.0",
    "discord.py>=2.0",
    "slack-bolt>=1.0",
    "twitchio>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
